name: mobile
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  dio: ^5.9.2
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_map: ^8.3.0
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.3.1
  formz: ^0.8.0
  geolocator: ^14.0.2
  go_router: ^17.2.1
  google_fonts: ^8.0.2
  image_picker: ^1.2.1
  just_audio: ^0.10.5
  latlong2: ^0.9.1
  record: ^6.2.0
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter_native_splash:
  color: "#252829"
  image: assets/icon/icon_foreground.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/icon/icon_foreground.png
    color: "#252829"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/splash/
    - assets/icon/
    - assets/images/headers/
    - assets/images/logo/
    - assets/images/buttons/client/
    - assets/images/buttons/vehicle_types/

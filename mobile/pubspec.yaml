name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  dio: ^5.9.2
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_map: ^8.3.0
  flutter_riverpod: ^3.3.1
  formz: ^0.8.0
  geolocator: ^14.0.2
  go_router: ^17.2.1
  google_fonts: ^8.0.2
  image_picker: ^1.2.1
  just_audio: ^0.10.5
  latlong2: ^0.9.1
  record: ^6.2.0
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/headers/
    - assets/images/logo/
    - assets/images/buttons/client/
    - assets/images/buttons/vehicle_types/
